<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Store</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"]
          }
        }
      }
    }
  </script> 
    <script src="script.js" defer></script>

</head>

<body class="min-h-screen bg-[#f8f9fa] text-[#202733] antialiased transition-colors duration-200 dark:bg-[#10141b] dark:text-[#f2f4f7]">

  <header class="h-[51px] border-b border-[#e5e7eb] bg-white dark:border-[#29303a] dark:bg-[#171b22]">
    <div class="mx-auto flex h-full max-w-[1200px] items-center justify-between px-[22px]">
      <div class="flex items-center gap-[9px]">
        <div class="flex h-[27px] w-[27px] items-center justify-center rounded bg-[#111827] text-[13px] font-bold text-white">
          M
        </div>
        <span class="text-[13px] font-bold tracking-[-0.15px] text-[#202733] dark:text-white">Minimal Store</span>
      </div>
      
       <button
        id="themeToggle"
        type="button"
        class="flex h-[27px] w-[150px] items-center justify-start border-2 rounded-full bg-white px-[10px] text-[9px] font-medium text-[#303944] hover:bg-[#f4f7f5] dark:bg-[#1b2028] dark:text-[#e5e7eb] dark:hover:bg-[#222933]"
        aria-label="Alternar tema"
      >

              <span id="themeLabel">Dark mode</span>
      </button>
    </div>
  </header>

  <main class="mx-auto grid max-w-[1200px] grid-cols-1 gap-[30px] px-[24px] pb-[43px] pt-[30px] lg:grid-cols-[minmax(0,1fr)_318px]">

    <section class="min-w-0">

      <div class="mb-[16px]">
        <div class="mb-[9px] flex items-center gap-[8px]">
          <span class="flex h-[19px] w-[19px] items-center justify-center rounded-full bg-[#f0f2f5] text-[9px] font-semibold text-[#6d7480] dark:bg-[#292f38] dark:text-[#b9c0ca]">1</span>
          <h2 class="text-[12px] font-bold text-[#202733] dark:text-white">Dados Pessoais</h2>
        </div>

                <div class="rounded-[10px] border border-[#e2e5e9] bg-white px-[17px] pb-[16px] pt-[17px] shadow-[0_1px_2px_rgba(0,0,0,.02)] dark:border-[#303743] dark:bg-[#191e26]">
          <div class="mb-[11px]">
            <label class="mb-[5px] block text-[9px] font-semibold text-[#424a56] dark:text-[#cbd1d9]">E-mail para confirmação</label>
            <div class="relative">
              <span class="pointer-events-none absolute left-[10px] top-1/2 -translate-y-1/2 text-[#8a919b]">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              </span>
              <input value="lucas.silva@exemplo.com.br" class="h-[34px] w-full rounded-[7px] border border-[#d9dde3] bg-white pl-[29px] pr-[10px] text-[10px] text-[#303744] outline-none focus:border-[#aab2bc] dark:border-[#3a424e] dark:bg-[#151a21] dark:text-[#eef1f5]" />
            </div>
          </div>

        <div class="mb-[11px] grid grid-cols-1 gap-[10px] sm:grid-cols-[1fr_1fr]">
            <div>
              <label class="mb-[5px] block text-[9px] font-semibold text-[#424a56] dark:text-[#cbd1d9]">Nome Completo</label>
              <input value="Lucas Silva" class="h-[34px] w-full rounded-[7px] border border-[#d9dde3] bg-white px-[10px] text-[10px] text-[#303744] outline-none focus:border-[#aab2bc] dark:border-[#3a424e] dark:bg-[#151a21] dark:text-[#eef1f5]" />
            </div>
            <div>
              <label class="mb-[5px] block text-[9px] font-semibold text-[#424a56] dark:text-[#cbd1d9]">CPF</label>
              <input value="342.890.128-40" class="h-[34px] w-full rounded-[7px] border border-[#d9dde3] bg-white px-[10px] text-[10px] text-[#303744] outline-none focus:border-[#aab2bc] dark:border-[#3a424e] dark:bg-[#151a21] dark:text-[#eef1f5]" />
            </div>
          </div>

        <div>
            <label class="mb-[5px] block text-[9px] font-semibold text-[#424a56] dark:text-[#cbd1d9]">Telefone / WhatsApp</label>
            <input value="(11) 98765-4321" class="h-[34px] w-full rounded-[7px] border border-[#d9dde3] bg-white px-[10px] text-[10px] text-[#303744] outline-none focus:border-[#aab2bc] dark:border-[#3a424e] dark:bg-[#151a21] dark:text-[#eef1f5]" />
          </div>
        </div>
      </div>

      <div class="mb-[17px]">
        <div class="mb-[9px] flex items-center gap-[8px]">
          <span class="flex h-[19px] w-[19px] items-center justify-center rounded-full bg-[#f0f2f5] text-[9px] font-semibold text-[#6d7480] dark:bg-[#292f38] dark:text-[#b9c0ca]">2</span>
          <h2 class="text-[12px] font-bold text-[#202733] dark:text-white">Endereço de Entrega</h2>
        </div>



</head>
